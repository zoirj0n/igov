name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/country-intel/web
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ vars.REGISTRY }}/country-intel/web
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  trigger-argocd:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag in dev overlay
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_REF_NAME#v}|" infra/k8s/overlays/dev/kustomization.yaml
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump dev image to ${{ github.ref_name }}"
          branch: bump-image-${{ github.ref_name }}
          title: "chore: bump dev image to ${{ github.ref_name }}"
          body: "Automated by release workflow. Promotion to prod requires manual approval."
